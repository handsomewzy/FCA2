# network structures
# network_g:
#   type: CAVSR
#   num_block: 25

# 纯粹的basicVSR CVPR2021，没有其他参数，直接使用
# network_g:
#   type: BasicVSRNet

# BasicVSR++
# network_g:
#   type: COMISR
#   input_shape: [8, 3, 64, 64]
#   output_shape: [8, 3, 256, 256]

# ftvsr 具体的参数配置
network_g:
  type: FTVSR
  mid_channels: 64 
  num_blocks: 60 
  stride: 4 
  keyframe_stride: 1
  d_model: 512 
  n_heads: 4
  # spynet_pretrained: 'https://download.openmmlab.com/mmediting/restorers/basicvsr/spynet_20210409-c6c1bd09.pth'
  spynet_pretrained: '/data1/userhome/luwen/Code/wzy/CAD2VSR/spynet_20210409-c6c1bd09.pth'

# path
path:
  # pretrain_network_g: /data1/userhome/luwen/Code/wzy/CAD2VSR/experiments/vid4_IconVSRNet_archived_20241012_231410/models/net_g_52000.pth
  pretrain_network_g: /data1/userhome/luwen/Code/wzy/CAD2VSR/experiments/vid4_ftvsr/models/net_g_310000.pth
  strict_load_g: true
  # resume_state: /data1/userhome/luwen/Code/wzy/CAD2VSR/experiments/vid4_ftvsr/training_states/310000.state

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: 0.05
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [400000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 400000
  warmup_iter: -1  # no warm up
  fix_flow: 5000
  flow_lr_mul: 0.125

  # losses
  pixel_opt:
    # type: bi_SD_CharbonnierLoss
    # loss_weight: [0.5, 0.25, 0.25]
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 1
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true


# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 10000
  use_tb_logger: false
  # wandb:
  #   project: vsr_best
  #   resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

find_unused_parameters: true
