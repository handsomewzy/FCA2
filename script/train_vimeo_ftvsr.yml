    meta_subroot: [0,0,0,15,25,35]
    meta_info_file: /data1/userhome/luwen/Code/wzy/CAD2VSR/basicsr/data/meta_info/meta_info_Vimeo90K_train_GT.txt
    val_partition: REDS4
    test_mode: true
    io_backend:
      type: disk

    num_frame: 20
    gt_size: 128
    interval_list: [1]
    random_reverse: true
    use_hflip: true
    use_rot: true
