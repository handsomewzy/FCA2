# general settings
# modelname: IconVSRNet RealBasicVSRNet
name: vid4_CAD2VSRnew
model_type: VideoRecurrentModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: Vimeo90K
    type: Vimeo90KRecurrentDataset
    dataroot_gt: /data1/userhome/luwen/Code/wzy/vimeo90k/GT
    # dataroot_lq: /data1/userhome/luwen/Code/wzy/REDS/train_sharp
    dataroot_lq: /data1/userhome/luwen/Code/wzy/vimeo90k/BDx4
    lq_subroot:  [BD, BD, BD, BD15, BD25, BD35]
    dataroot_meta: datasets/Vimeo/lq/meta
    meta_subroot: [0,0,0,15,25,35]
    meta_info_file: /data1/userhome/luwen/Code/wzy/CAD2VSR/basicsr/data/meta_info/meta_info_Vimeo90K_train_GT.txt
    val_partition: REDS4
    test_mode: true
    io_backend:
      type: disk

    num_frame: 20
    gt_size: 256
    interval_list: [1]
    random_reverse: false
    use_hflip: true
    use_rot: true
    flip_sequence: false # true
    # data loader
    num_worker_per_gpu: 16
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 20
    prefetch_mode: ~

  val_15:
    name: Vid4_BD15
    type: VideoRecurrentTestDataset
    dataroot_gt: /data1/userhome/luwen/Code/wzy/vid4_crf/GT
    dataroot_lq: /data1/userhome/luwen/Code/wzy/vid4_crf/BD_15
    cache_data: true
    io_backend:
      type: disk
    num_frame: -1

  val_25:
    name: Vid4_BD25
    type: VideoRecurrentTestDataset
    dataroot_gt: /data1/userhome/luwen/Code/wzy/vid4_crf/GT
    dataroot_lq: /data1/userhome/luwen/Code/wzy/vid4_crf/BD_25
    cache_data: true
    io_backend:
      type: disk
    num_frame: -1

  val_35:
    name: Vid4_BD35
    type: VideoRecurrentTestDataset
    dataroot_gt: /data1/userhome/luwen/Code/wzy/vid4_crf/GT
    dataroot_lq: /data1/userhome/luwen/Code/wzy/vid4_crf/BD_35
    cache_data: true
    io_backend:
      type: disk
    num_frame: -1

