# network structures
# network_g:
#   type: CAVSR
#   num_block: 25

# 纯粹的basicVSR CVPR2021，没有其他参数，直接使用
# network_g:
#   type: BasicVSRNet

# BasicVSR++
network_g:
  type: CAD2VSR
  spynet_pretrained: '/data1/userhome/luwen/Code/wzy/CAD2VSR/spynet_20210409-c6c1bd09.pth'
  mid_channels: 64
  num_propagation_blocks: 20
  num_cleaning_blocks: 20
  dynamic_refine_thres: 255 

# EDVR
# network_g:
#   type: FTVSR

# path
path:
  pretrain_network_g: /data1/userhome/luwen/Code/wzy/CAD2VSR/experiments/vid4_CAD2VSR/models/net_g_400000.pth
  # pretrain_network_g: /data1/userhome/luwen/Code/wzy/CAD2VSR/realbasicvsr_wogan_c64b20_2x30x8_lr1e-4_300k_reds_20211027-0e2ff207.pth
  strict_load_g: false
  # resume_state: /data1/userhome/luwen/Code/wzy/CAD2VSR/experiments/vid4_CAD2VSR/training_states/50000.state

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [400000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 400000
  warmup_iter: -1  # no warm up
  fix_flow: 5000
  flow_lr_mul: 0.125

  # losses
  pixel_opt:
    # type: bi_SD_CharbonnierLoss
    # loss_weight: [0.5, 0.25, 0.25]
    type: CharbonnierLoss_gae
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 5000
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true


# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
  use_tb_logger: false
  # wandb:
  #   project: vsr_best
  #   resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500

find_unused_parameters: true
